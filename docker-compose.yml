services:
  publisher:
    build:
      context: .
      dockerfile: Dockerfile
    image: mihomo-sub-publisher:latest
    container_name: mihomo-publisher
    restart: unless-stopped
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data
      - ./cache:/app/cache
    environment:
      - TZ=Asia/Shanghai
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:alpine
    container_name: mihomo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      publisher:
        condition: service_healthy

version: 1

source:
  url: "https://example.com/subscription.yaml"
  interval: 1h
  timeout: 30s
  headers:
    User-Agent: "clash.meta"

extensions:
  proxies:
    prepend: []
    append: []
    replace: []
    remove: []

  proxy-groups:
    prepend: []
    append: []
    replace: []
    remove: []
    inject: []
    # preserve-default: true  # 默认 true：保持上游组默认(首个)代理在 index 0；
    #                         # 置 false 让 prepend/inject 的前置代理成为组内第一项

  rules:
    prepend:
      - "RULE-SET,direct-domain,DIRECT"
    append:
      - "MATCH,PROXY"
    replace: []
    remove: []

  dns:
    override: {}

  probe:
    override: {}

rules:
  providers:
    clash-rules-cn:
      enabled: true
      client-path-prefix: "./ruleset/"

server:
  listen: "127.0.0.1:8080"
  config-path: "/config/{token}"
  shutdown-timeout: 10s
  # allowed-user-agents: ["*clash*", "*mihomo*", "*stash*"]  # 默认值；通配符 * 匹配任意字符（含 /），
  #                                                          # 配置后按通配符匹配（模式 "clash" 只匹配字面 "clash"）
  # required-headers: {}  # 例: {"X-Api-Key": "*"} 要求该头存在；值为具体字符串时要求精确(忽略大小写)匹配

storage:
  cache-dir: "./cache"
  data-dir: "./data"

hot-reload:
  debounce: 1m
